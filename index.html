<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOUSA AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070709;color:#f5f5f7;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1100px;margin:auto;padding:42px 22px}.brand{font-size:48px;font-weight:800;letter-spacing:-2px}.tag{color:#a7a7ad;font-size:19px;margin-top:8px}.card{margin-top:32px;border:1px solid #292a31;border-radius:24px;background:#101116;padding:30px;min-height:620px;display:flex;flex-direction:column}.chat{flex:1;overflow:auto;padding:6px 0 20px}.msg{margin:0 0 14px;padding:17px 18px;border-radius:16px;line-height:1.5}.ai{background:#181a21}.user{background:#232630;text-align:left}.name{font-weight:700;margin-bottom:5px}.error{background:#40181e;border:1px solid #8c303c;color:#ffd9dd}.composer{display:flex;gap:12px;margin-top:auto}.composer input{flex:1;min-width:0;background:#090a0e;border:1px solid #363740;border-radius:15px;padding:17px;color:#fff;font-size:16px;outline:none}.composer input:focus{border-color:#777}.composer button{border:0;border-radius:15px;padding:0 28px;font-size:16px;font-weight:700;cursor:pointer}.composer button:disabled{opacity:.55}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.tool{border:1px solid #292a31;border-radius:15px;padding:18px;text-align:center;color:#c7c7cc;background:#111217}@media(max-width:700px){.wrap{padding:28px 14px}.brand{font-size:38px}.card{padding:18px;min-height:650px}.composer{gap:8px}.composer button{padding:0 20px}.tools{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">NOUSA AI</div>
  <div class="tag">Next-Generation Online Utility &amp; Smart AI</div>
  <div class="card">
    <div id="chat" class="chat">
      <div class="msg ai"><div class="name">NOUSA AI</div>Hello! I'm NOUSA AI. Ask me anything.</div>
    </div>
    <form id="form" class="composer">
      <input id="input" autocomplete="off" placeholder="Message NOUSA AI...">
      <button id="send" type="submit">Send</button>
    </form>
    <div class="tools">
      <div class="tool">🖼️ Image Studio</div><div class="tool">🎬 Video Studio</div><div class="tool">🎵 Music Studio</div><div class="tool">💻 App Builder</div>
    </div>
  </div>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');
const form=document.getElementById('form');
const send=document.getElementById('send');
const history=[];
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function add(text,kind,name){const d=document.createElement('div');d.className='msg '+kind;d.innerHTML='<div class="name">'+esc(name)+'</div>'+esc(text).replace(/\n/g,'<br>');chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function addError(message,details){const d=document.createElement('div');d.className='msg error';d.innerHTML='<div class="name">❌ NOUSA AI ERROR</div>'+esc(message)+(details?'<br><small>'+esc(details)+'</small>':'');chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text)return;
  add(text,'user','You');
  history.push({role:'user',content:text});
  input.value='';send.disabled=true;send.textContent='Thinking...';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const data=await r.json().catch(()=>({error:'Server returned non-JSON data.',details:'HTTP '+r.status}));
    if(!r.ok||data.error){addError(data.error||('Request failed (HTTP '+r.status+')'),data.details);return;}
    if(!data.text){addError('OpenAI returned no text.',data.details||'No text was found in the API response.');return;}
    add(data.text,'ai','NOUSA AI');history.push({role:'assistant',content:data.text});
  }catch(err){addError('Network/browser error.',err?.message||String(err));}
  finally{send.disabled=false;send.textContent='Send';input.focus();}
});
</script>
</body>
</html>
