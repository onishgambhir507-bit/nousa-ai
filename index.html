<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOUSA AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#070709;color:#f7f7f8;font-family:Inter,system-ui,Arial,sans-serif}main{max-width:1050px;margin:auto;padding:42px 18px 70px}h1{font-size:48px;margin:0 0 6px}p.sub{color:#aaa;margin:0 0 28px;font-size:18px}.panel{background:#111217;border:1px solid #292b33;border-radius:22px;padding:22px}.chat{min-height:260px;max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}.msg{padding:14px 16px;border-radius:15px;background:#191b22}.user{align-self:flex-end;background:#242731;max-width:85%}.inputrow{display:flex;gap:10px}.inputrow input{flex:1;background:#08090c;border:1px solid #30323a;color:white;padding:15px;border-radius:14px;font-size:16px}.btn{border:0;border-radius:14px;padding:0 24px;font-weight:700;cursor:pointer}.send{background:white;color:#080808}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.tool{background:#15171d;border:1px solid #2b2d35;border-radius:16px;padding:20px;cursor:pointer}.tool:hover{border-color:#666}.tool b{font-size:18px}.tool small{display:block;color:#999;margin-top:5px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px}.modalbox{width:min(650px,100%);background:#111217;border:1px solid #333;border-radius:20px;padding:22px}.modalbox h2{margin-top:0}.modalbox textarea{width:100%;min-height:130px;background:#08090c;border:1px solid #333;color:#fff;border-radius:12px;padding:14px;font-size:16px}.actions{display:flex;gap:10px;margin-top:12px}.actions button{padding:12px 18px;border-radius:12px;border:0;font-weight:700}.primary{background:white}.secondary{background:#292b32;color:white}.result img{max-width:100%;border-radius:14px;margin-top:15px}.result video{max-width:100%;border-radius:14px;margin-top:15px}.status{color:#aaa;margin-top:12px}.error{color:#ffb4b4;background:#421b20;border:1px solid #81333d;padding:12px;border-radius:12px;margin-top:12px;white-space:pre-wrap;overflow:auto}.download{display:inline-block;margin-top:12px;color:#fff;background:#252830;padding:10px 14px;border-radius:10px;text-decoration:none}@media(max-width:650px){h1{font-size:38px}.tools{grid-template-columns:1fr}.inputrow{flex-direction:column}.send{height:48px}}
</style></head><body><main><h1>NOUSA AI</h1><p class="sub">Next-Generation Online Utility & Smart AI</p><section class="panel"><div id="chat" class="chat"><div class="msg"><b>NOUSA AI</b><br>Hello! I'm NOUSA AI. Ask me anything.</div></div><form id="chatForm" class="inputrow"><input id="message" placeholder="Message NOUSA AI..." autocomplete="off"><button class="btn send">Send</button></form><div class="tools"><div class="tool" data-tool="image"><b>🖼️ Image Studio</b><small>Generate real AI images</small></div><div class="tool" data-tool="video"><b>🎬 Video Studio</b><small>Generate real AI videos</small></div></div></section></main>
<div id="modal" class="modal"><div class="modalbox"><h2 id="modalTitle"></h2><textarea id="prompt" placeholder="Describe what you want to create..."></textarea><div class="actions"><button id="close" class="secondary">Close</button><button id="create" class="primary">Create</button></div><div id="result" class="result"></div></div></div>
<script>
const $=id=>document.getElementById(id);let history=[];let tool='';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('chatForm').onsubmit=async e=>{e.preventDefault();const inp=$('message'),text=inp.value.trim();if(!text)return;inp.value='';$('chat').innerHTML+=`<div class="msg user">${esc(text)}</div>`;history.push({role:'user',content:text});const b=e.submitter;b.disabled=true;b.textContent='Thinking...';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const x=await r.json();if(!r.ok||x.error)throw new Error(JSON.stringify(x,null,2));history.push({role:'assistant',content:x.text});$('chat').innerHTML+=`<div class="msg"><b>NOUSA AI</b><br>${esc(x.text).replace(/\n/g,'<br>')}</div>`}catch(err){$('chat').innerHTML+=`<div class="error">❌ ${esc(err.message)}</div>`}$('chat').scrollTop=$('chat').scrollHeight;b.disabled=false;b.textContent='Send'};
function openTool(t){tool=t;$('modalTitle').textContent=t==='image'?'🖼️ Image Studio':'🎬 Video Studio';$('prompt').value='';$('result').innerHTML='';$('modal').style.display='flex';$('prompt').focus()}
document.querySelectorAll('.tool').forEach(x=>x.onclick=()=>openTool(x.dataset.tool));$('close').onclick=()=>{$('modal').style.display='none'};
$('create').onclick=async()=>{const p=$('prompt').value.trim();if(!p)return;$('create').disabled=true;$('result').innerHTML='<div class="status">Creating... please wait.</div>';try{if(tool==='image'){const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});const x=await r.json();if(!r.ok||x.error)throw new Error(JSON.stringify(x,null,2));$('result').innerHTML=`<img src="${x.image}" alt="Generated image"><br><a class="download" download="nousa-ai-image.png" href="${x.image}">Download image</a>`}else{const r=await fetch('/api/video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});const x=await r.json();if(!r.ok||x.error)throw new Error(JSON.stringify(x,null,2));let id=x.id;$('result').innerHTML=`<div class="status" id="vstatus">Video job: ${esc(id)}<br>Starting…</div>`;let done=false;for(let i=0;i<120&&!done;i++){await new Promise(res=>setTimeout(res,5000));const sr=await fetch('/api/video/'+encodeURIComponent(id));const s=await sr.json();if(!sr.ok||s.error)throw new Error(JSON.stringify(s,null,2));const pct=s.progress??0;$('vstatus').innerHTML=`<div class="status">Status: ${esc(s.status||'processing')} — ${Math.round(pct)}%</div>`;if(s.status==='completed'){done=true;$('result').innerHTML+=`<video controls playsinline src="/api/video/${encodeURIComponent(id)}/content"></video><br><a class="download" href="/api/video/${encodeURIComponent(id)}/content" download="nousa-ai-video.mp4">Download video</a>`}if(s.status==='failed'||s.status==='cancelled')throw new Error('Video generation '+s.status+'.')}}}catch(err){$('result').innerHTML=`<div class="error">❌ ${esc(err.message)}</div>`}$('create').disabled=false};
</script></body></html>
