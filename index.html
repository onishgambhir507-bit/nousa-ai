<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOUSA AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#07070a;color:#fff;min-height:100vh}main{max-width:900px;margin:auto;padding:32px 18px}.brand{font-size:42px;font-weight:800;letter-spacing:-1px}.tag{color:#aaa;margin:4px 0 28px}.card{background:#111217;border:1px solid #292b34;border-radius:22px;padding:18px;box-shadow:0 10px 40px #0005}.chat{height:420px;overflow:auto;padding:8px}.msg{padding:12px 14px;margin:10px 0;border-radius:15px;line-height:1.5;white-space:pre-wrap}.user{background:#22242d;margin-left:12%}.ai{background:#171921;margin-right:12%}.error{background:#351519;border:1px solid #7b3038;color:#ffd9dc}.row{display:flex;gap:10px;margin-top:12px}input{flex:1;background:#0b0c10;border:1px solid #343640;color:#fff;border-radius:14px;padding:14px;font-size:16px;outline:none}button{border:0;border-radius:14px;padding:0 22px;background:#fff;color:#000;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.55}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.tool{border:1px solid #292b34;border-radius:14px;padding:15px;text-align:center;color:#bbb}@media(max-width:650px){.brand{font-size:34px}.tools{grid-template-columns:repeat(2,1fr)}.chat{height:380px}.user{margin-left:3%}.ai{margin-right:3%}}
</style>
</head>
<body>
<main>
  <div class="brand">NOUSA AI</div>
  <div class="tag">Next-Generation Online Utility &amp; Smart AI</div>
  <section class="card">
    <div id="chat" class="chat">
      <div class="msg ai"><b>NOUSA AI</b><br>Hello! I'm NOUSA AI. Ask me anything.</div>
    </div>
    <div class="row">
      <input id="input" autocomplete="off" placeholder="Message NOUSA AI...">
      <button id="send" type="button">Send</button>
    </div>
    <div id="tools" class="tools">
      <div class="tool">🖼️ Image Studio</div><div class="tool">🎬 Video Studio</div><div class="tool">🎵 Music Studio</div><div class="tool">💻 App Builder</div>
    </div>
  </section>
</main>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');
const send=document.getElementById('send');
const history=[];
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=esc(text);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function sendMessage(){
  const text=input.value.trim();
  if(!text||send.disabled)return;
  input.value='';
  add(text,'user');
  history.push({role:'user',content:text});
  send.disabled=true;send.textContent='Sending...';
  const thinking=add('Thinking...','ai');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const raw=await r.text();
    let data;try{data=JSON.parse(raw)}catch{throw new Error(`Server returned HTTP ${r.status}, but not JSON. Raw response: ${raw.slice(0,500)}`)}
    if(!r.ok||data.ok===false){
      const detail=data.details?`\nDetails: ${data.details}`:'';
      throw new Error(`${data.error||'Request failed'}${detail}`);
    }
    thinking.remove();
    add(data.text||'NOUSA AI returned an empty response.','ai');
    history.push({role:'assistant',content:data.text||''});
  }catch(e){
    thinking.remove();
    add('❌ '+(e.message||String(e)),'error');
  }finally{send.disabled=false;send.textContent='Send';input.focus()}
}
send.addEventListener('click',sendMessage);
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
</script>
</body>
</html>
