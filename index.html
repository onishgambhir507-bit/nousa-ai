<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOUSA AI</title><style>body{margin:0;background:#070910;color:#fff;font-family:Arial,sans-serif}main{max-width:900px;margin:auto;padding:50px 20px}h1{text-align:center;font-size:64px}h1 span{color:#42a8ff}.tag{text-align:center;color:#9aa7ba}.card{margin:28px 0;padding:24px;background:#0d131f;border:1px solid #ffffff18;border-radius:18px}.center{text-align:center}.chat{height:400px;overflow:auto}.msg{padding:14px;margin:10px 0;background:#141c2b;border-radius:12px;white-space:pre-wrap}.you{margin-left:15%;background:#123052}.composer{display:flex;gap:10px}input{flex:1;padding:14px;background:#080d16;color:#fff;border:1px solid #28354b;border-radius:10px}button{padding:14px 20px;border:0;border-radius:10px;background:#167dff;color:#fff;font-weight:bold}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tool{padding:18px;text-align:center;background:#111827;border-radius:12px}@media(max-width:600px){h1{font-size:48px}.tools{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>NOUSA <span>AI</span></h1><p class="tag">Imagine • Create • Inspire</p><div class="card center"><b>Short form:</b> NOUSA AI<br><br><b>Full form:</b> Next-Generation Online Utility &amp; Smart AI</div><div class="card"><h2>🤖 NOUSA AI Assistant</h2><div class="chat" id="chat"><div class="msg"><b>NOUSA AI</b><br>Hi! Ask me anything.</div></div><div class="composer"><input id="p" placeholder="Message NOUSA AI..." onkeydown="if(event.key==='Enter')send()"><button id="b" onclick="send()">Send</button></div></div><div class="card"><h2>Creative Tools</h2><div class="tools"><div class="tool">🎨<br>Image Studio</div><div class="tool">🎬<br>Video Studio</div><div class="tool">🎵<br>Music Studio</div><div class="tool">📱<br>App Builder</div></div></div></main><script>const history=[];function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function send(){let p=document.getElementById('p'),b=document.getElementById('b'),c=document.getElementById('chat'),v=p.value.trim();if(!v||b.disabled)return;c.innerHTML+='<div class="msg you"><b>You</b><br>'+esc(v)+'</div>';history.push({role:'user',content:v});p.value='';b.disabled=true;b.textContent='...';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');c.innerHTML+='<div class="msg"><b>NOUSA AI</b><br>'+esc(d.text||'No response returned.')+'</div>';history.push({role:'assistant',content:d.text||''})}catch(e){c.innerHTML+='<div class="msg"><b>NOUSA AI</b><br>'+esc(e.message)+'</div>}b.disabled=false;b.textContent='Send';c.scrollTop=c.scrollHeight}</script></body></html>
